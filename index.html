<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpg" href="" alt="chi squared image">
    <title>Gravity</title>
</head>

<body>
    <div id="container">
        <div id="canvascontainer">
            <canvas id="canvas" width="800px" height="600px"></canvas>
        </div>

        <div id="tools">
            <div id="toolsContent">

                <!-- Focus Section -->
                <div class="toolSection" id="focusSection">
                    <label class="sectionLabel">Focus</label>

                    <select id="focusMenu" class="tooloptions">
                        <option value="none">None</option>
                    </select>

                    <div class="tooloptions">
                        <input type="checkbox" class="checkbox" id="shownames" value="shownames" checked>
                        <label for="shownames" class="text">Show Names</label>
                    </div>
                </div>

                <!-- Create Body Section -->
                <div class="toolSection">
                    <label class="sectionLabel">Create</label>

                    <select id="bodyTypeMenu" class="tooloptions">
                        <option value="star">Star</option>
                        <option value="gas">Gas Body</option>
                        <option value="solid">Solid Body</option>
                    </select>

                    <!-- <input type="number" id="massInput" class="tooloptions inputField"> -->
                    <div class="inputRow">
                        <label class="text">Mass:</label>
                        <input type="number" id="massInput" class="inputField" placeholder="10^30 kg (0.5 suns)">
                    </div>

                    <div class="inputRow">
                        <label class="text">Name:</label>
                        <input type="string" id="nameInput" class="inputField" placeholder="name">
                    </div>

                    <button id="createBody" class="tooloptions">Create</button>
                </div>

                <!-- Adjust Section -->
                <div class="toolSection">
                    <label class="sectionLabel">Modify</label>

                    <!-- YOUR EXISTING Adjust DROPDOWN -->
                    <select id="adjustMenu" class="tooloptions">
                        <option value="none">None</option>
                    </select>

                    <div class="inputRow">
                        <label class="text">Xpos:</label>
                        <input type="number" id="xpos" class="inputField" placeholder="10^6 km">
                    </div>

                    <div class="inputRow">
                        <label class="text">Ypos:</label>
                        <input type="number" id="ypos" class="inputField"  placeholder="10^6 km">
                    </div>

                    <div class="inputRow">
                        <label class="text">Xvel:</label>
                        <input type="number" id="xvel" class="inputField" placeholder="km/s">
                    </div>

                    <div class="inputRow">
                        <label class="text">Yvel:</label>
                        <input type="number" id="yvel" class="inputField" placeholder="km/s">
                    </div>

                    <button id="deleteBody" class="tooloptions">Delete Body</button>
                    <button id="deleteTrail" class="tooloptions">Clear Trail</button>
                </div>

                <!-- <p id="debug">text</p> -->

            </div>
        </div>

        <button id="toggleTools">▲</button>

        <div id="lowerLeftButtons">
            <button id="resetView">Reset View</button>
        </div>

        <div id="lowerRightButtons">
            <button id="reverse">Reverse</button>
            <button id="backward">&lt &lt</button>
            <button id="pause">⏸︎</button>
            <button id="forward">&gt &gt</button>
        </div>

        <div id="upperRightButtons">
            <button id="clearAll">Clear All</button>
        </div>
    </div>

    <script defer src="elements/body.js"></script>
    <script defer src="elements/trail.js"></script>
    <script defer src="elements/solar_system.js"></script>

    <script defer src="view/rendering.js"></script>
    <script defer src="view/viewcontrols.js"></script>
    <script defer src="view/adjuster.js"></script>
    <script defer src="view/timecontrols.js"></script>

    <script defer src="simulation.js"></script>
    <script defer src="script.js"></script>

</body>
</html>
